<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Loop Gallery GSAP</title>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #111;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }
        .gallery {
            position: absolute;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .cards {
            position: absolute;
            width: 14rem;
            height: 18rem;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cards li {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 14rem;
            aspect-ratio: 9/16;
            text-align: center;
            line-height: 18rem;
            font-size: 2rem;
            position: absolute;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            top: 0;
            left: 0;
            border-radius: 0.8rem;
            visibility: hidden; /* Mencegah kedipan sebelum GSAP merender */
        }

        .actions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            background: #88ce02;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: #111;
        }
        button:hover {
            background: #99ef02;
        }

        .drag-proxy {
            visibility: hidden;
            position: absolute;
        }
    </style>
</head>
<body>

<div class="gallery">
	<ul class="cards">
		<li style="background-image: url(https://assets.codepen.io/16327/portrait-number-01.png)"></li>
        <li style="background-image: url(https://assets.codepen.io/16327/portrait-number-02.png)"></li>
        <li style="background-image: url(https://assets.codepen.io/16327/portrait-number-03.png)"></li>
        <li style="background-image: url(https://assets.codepen.io/16327/portrait-number-04.png)"></li>
        <li style="background-image: url(https://assets.codepen.io/16327/portrait-number-05.png)"></li>
        <li style="background-image: url(https://assets.codepen.io/16327/portrait-number-06.png)"></li>
        <li style="background-image: url(https://assets.codepen.io/16327/portrait-number-07.png)"></li>		
	</ul>
	<div class="actions">
		<button class="prev">Prev</button>
		<button class="next">Next</button>
	</div>
</div>
<div class="drag-proxy"></div>

    <!-- GSAP & Plugins CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger, Draggable);

        let iteration = 0;

        const cards = gsap.utils.toArray('.cards li');
        
        // Buat elemen langsung terlihat setelah GSAP diinisialisasi
        gsap.set(cards, {visibility: "visible"});

        const spacing = 0.15,
            snapTime = gsap.utils.snap(spacing),
            
            animateFunc = element => {
                const tl = gsap.timeline();
                tl.fromTo(element, {scale: 0, opacity: 0}, {scale: 1, opacity: 1, zIndex: 100, duration: 0.5, yoyo: true, repeat: 1, ease: "power1.in", immediateRender: false})
                  .fromTo(element, {xPercent: 300}, {xPercent: -300, duration: 1, ease: "none", immediateRender: false}, 0);
                return tl;
            },
            
            seamlessLoop = buildSeamlessLoop(cards, spacing, animateFunc),
            playhead = {offset: 0},
            wrapTime = gsap.utils.wrap(0, seamlessLoop.duration()),
            
            scrub = gsap.to(playhead, {
                offset: 0,
                onUpdate() {
                    seamlessLoop.time(wrapTime(playhead.offset));
                },
                duration: 0.8,
                ease: "power3",
                paused: true
            }),
            
            trigger = ScrollTrigger.create({
                start: 0,
                onUpdate(self) {
                    let scroll = self.scroll();
                    if (scroll > self.end - 1) {
                        wrap(1, 2);
                    } else if (scroll < 1 && self.direction < 0) {
                        wrap(-1, self.end - 2);
                    } else {
                        scrub.vars.offset = (iteration + self.progress) * seamlessLoop.duration();
                        scrub.invalidate().restart();
                    }
                },
                end: "+=4000",
                pin: ".gallery"
            }),
            
            progressToScroll = progress => gsap.utils.clamp(1, trigger.end - 1, gsap.utils.wrap(0, 1, progress) * trigger.end),
            
            wrap = (iterationDelta, scrollTo) => {
                iteration += iterationDelta;
                trigger.scroll(scrollTo);
                trigger.update();
            };

        ScrollTrigger.addEventListener("scrollEnd", () => scrollToOffset(scrub.vars.offset));

        function scrollToOffset(offset) {
            let snappedTime = snapTime(offset),
                progress = (snappedTime - seamlessLoop.duration() * iteration) / seamlessLoop.duration(),
                scroll = progressToScroll(progress);
            if (progress >= 1 || progress < 0) {
                return wrap(Math.floor(progress), scroll);
            }
            trigger.scroll(scroll);
        }

        document.querySelector(".next").addEventListener("click", () => scrollToOffset(scrub.vars.offset + spacing));
        document.querySelector(".prev").addEventListener("click", () => scrollToOffset(scrub.vars.offset - spacing));

        Draggable.create(".drag-proxy", {
          type: "x",
          trigger: ".gallery",
          onPress() {
            this.startOffset = scrub.vars.offset;
          },
          onDrag() {
            scrub.vars.offset = this.startOffset + (this.startX - this.x) * 0.002;
            scrub.invalidate().restart();
          },
          onDragEnd() {
            scrollToOffset(scrub.vars.offset);
          }
        });

        function buildSeamlessLoop(items, spacing, animateFunc) {
            let overlap = Math.ceil(1 / spacing),
                startTime = items.length * spacing,
                loopTime = (items.length + overlap) * spacing,
                rawSequence = gsap.timeline({paused: true}),
                seamlessLoop = gsap.timeline({
                    paused: true,
                    repeat: -1,
                    onRepeat() {
                        this._time === this._dur && (this._tTime += this._dur - 0.01);
                    }
                }),
                l = items.length + overlap * 2,
                time, i, index;

            for (i = 0; i < l; i++) {
                index = i % items.length;
                time = i * spacing;
                rawSequence.add(animateFunc(items[index]), time);
                i <= items.length && seamlessLoop.add("label" + i, time);
            }

            rawSequence.time(startTime);
            
            seamlessLoop.to(rawSequence, {
                time: loopTime,
                duration: loopTime - startTime,
                ease: "none"
            }).fromTo(rawSequence, {time: overlap * spacing}, {
                time: startTime,
                duration: startTime - (overlap * spacing),
                immediateRender: false,
                ease: "none"
            });
            
            return seamlessLoop;
        }
    </script>
</body>
</html>
